<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #F4F6F8; font-family: 'Figtree', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B85A0D; text-decoration: none; }
    a:hover { color: #8F4509; }
  </style>
</helmet>

<div style="width: 1040px; display: flex; flex-direction: column; gap: 18px; padding: 22px; background: #F4F6F8; color: #16233A;">

  <!-- reproductor con el aviso de autoplay -->
  <div style="position: relative; height: 559px; border-radius: 12px; background: #0C1116; overflow: hidden;">

    <div style="position: absolute; inset: 0; background: rgba(8, 11, 15, .78); display: flex; align-items: center; justify-content: center;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 470px;">

        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.45);">Siguiente clase</span>

        <div style="display: flex; align-items: center; gap: 18px; width: 100%; padding: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 12px;">

          <div style="position: relative; width: 62px; height: 62px; flex: none;">
            <svg width="62" height="62" viewBox="0 0 62 62">
              <circle cx="31" cy="31" r="27" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="4"></circle>
              <circle cx="31" cy="31" r="27" fill="none" stroke="#E8720C" stroke-width="4" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="42" transform="rotate(-90 31 31)"></circle>
            </svg>
            <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #FFFFFF; font-variant-numeric: tabular-nums;">4</span>
            </div>
          </div>

          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
            <span style="font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 16px; color: #FFFFFF; letter-spacing: -0.015em;">Índices parciales y por expresión</span>
            <span style="font-size: 12.5px; color: rgba(255,255,255,.5);">Clase 20 · 16:40 · Módulo 4</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
          <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 9px; height: 44px; background: #E8720C; border-radius: 10px; font-size: 14.5px; font-weight: 700; color: #FFFFFF;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5.5v13l11-6.5z"></path></svg>
            <span>Reproducir ahora</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 22px; border: 1px solid rgba(255,255,255,.24); border-radius: 10px; font-size: 14.5px; font-weight: 600; color: rgba(255,255,255,.85);">Cancelar</div>
        </div>

        <span style="font-size: 12.5px; color: rgba(255,255,255,.42);">Clase 19 marcada como vista</span>

      </div>
    </div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.18);">
      <div style="width: 100%; height: 5px; background: #E8720C;"></div>
    </div>
  </div>

  <!-- atajos de teclado -->
  <div style="display: flex; align-items: center; gap: 16px; background: #FFFFFF; border: 1px solid #E3E8EE; border-radius: 11px; padding: 14px 18px;">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #8B97A9; flex: none;">Atajos</span>

    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="height: 24px; min-width: 56px; padding: 0 9px; border: 1px solid #D8DFE7; border-bottom-width: 2px; border-radius: 5px; background: #FBFCFD; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;">Espacio</span>
      <span style="font-size: 12.5px; color: #56647D;">pausa</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="height: 24px; min-width: 24px; padding: 0 8px; border: 1px solid #D8DFE7; border-bottom-width: 2px; border-radius: 5px; background: #FBFCFD; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;">← →</span>
      <span style="font-size: 12.5px; color: #56647D;">5 s</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="height: 24px; min-width: 24px; padding: 0 8px; border: 1px solid #D8DFE7; border-bottom-width: 2px; border-radius: 5px; background: #FBFCFD; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;">J L</span>
      <span style="font-size: 12.5px; color: #56647D;">10 s</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="height: 24px; min-width: 24px; padding: 0 9px; border: 1px solid #D8DFE7; border-bottom-width: 2px; border-radius: 5px; background: #FBFCFD; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;">N</span>
      <span style="font-size: 12.5px; color: #56647D;">siguiente</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="height: 24px; min-width: 24px; padding: 0 9px; border: 1px solid #D8DFE7; border-bottom-width: 2px; border-radius: 5px; background: #FBFCFD; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;">M</span>
      <span style="font-size: 12.5px; color: #56647D;">marcar vista</span>
    </div>

    <div style="flex-grow: 1;"></div>
    <span style="font-size: 12.5px; color: #8B97A9;">Al volver, arranca 5 s antes</span>
  </div>

</div>
</x-dc>
</body>
</html>
